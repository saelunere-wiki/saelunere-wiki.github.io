name: Build and deploy wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content — no secrets, no leftover DM-only markers
        run: |
          set -e
          if grep -rnE "DM[ _-]?ONLY|DO NOT PUBLISH|HIDDEN MOTIVE|FUTURE PLOT|PRIVATE NOTE" site-content/; then
            echo "::error::Found a secret/DM-only marker in site-content/ — aborting deploy."
            exit 1
          fi
          if grep -rlE "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" site-content/ build_site.py; then
            echo "::error::Found what looks like a credential/token in tracked content — aborting deploy."
            exit 1
          fi
          echo "Validation passed."

      - name: Build site
        run: python build_site.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp campaign_site.html dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
